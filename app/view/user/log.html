{extend name="common/layout" /}
{block name="title"}操作日志{/block}
{block name="main"}

<div class="row">
	<div class="col-xs-12 center-block" style="float: none;">
	<div class="panel panel-default panel-intro">
	<div class="panel-body">
	
<form onsubmit="return searchSubmit()" method="GET" class="form-inline" id="searchToolbar">
  <div class="form-group">
	<label>搜索</label>
    {if request()->user['level'] eq 2}<input type="text" class="form-control" name="uid" placeholder="UID">{/if}
	<input type="text" class="form-control" name="domain" placeholder="域名">
	<input type="text" class="form-control" name="kw" placeholder="操作类型/操作详情">
  </div>
  <button type="submit" class="btn btn-primary"><i class="fa fa-search"></i> 搜索</button>
  <a href="javascript:searchClear()" class="btn btn-default" title="刷新日志列表"><i class="fa fa-refresh"></i> 刷新</a>
  {if request()->user['level'] eq 2}
  <span class="text-muted" style="margin-left:8px;">指定ID</span>
  <input type="text" class="form-control" id="logDeleteIds" placeholder="如 1023,1024" style="width:130px;">
  <button type="button" class="btn btn-danger" onclick="deleteSpecifiedLogs()"><i class="fa fa-trash"></i> 删除指定</button>
  <button type="button" class="btn btn-danger" onclick="deleteSelectedLogs()"><i class="fa fa-trash"></i> 批量删除所选</button>
  <button type="button" class="btn btn-warning" onclick="retainRecentLogs()"><i class="fa fa-calendar"></i> 仅保留最近7天</button>
  {/if}
</form>

      <table id="listTable">
	  </table>
    </div>
  </div>
</div>
</div>
{/block}
{block name="script"}
<script src="/static/js/layer/layer.js"></script>
<script src="/static/js/bootstrap-table-1.21.4.min.js"></script>
<script src="/static/js/bootstrap-table-page-jump-to-1.21.4.min.js"></script>
<script src="/static/js/custom.js?v=1006"></script>
<script>
$(document).ready(function(){
	updateToolbar();
	const pageSizeKey = 'userlog_pagesize';
	const pageNumber = typeof window.$_GET['pageNumber'] != 'undefined' ? parseInt(window.$_GET['pageNumber']) : 1;
	const pageSize = getStoredPageSize(pageSizeKey);

	$("#listTable").bootstrapTable({
		url: '/log/data',
		pageNumber: pageNumber,
		pageSize: pageSize,
		classes: 'table table-striped table-hover table-bordered',
		columns: [
			{if request()->user['level'] eq 2}
			{
				checkbox: true,
				field: '_selected',
				align: 'center',
				valign: 'middle'
			},
			{/if}
			{
				field: 'id',
				title: 'ID',
				formatter: function(value, row, index) {
					var html = String(value);
					{if request()->user['level'] eq 2}
					html += ' <a href="javascript:deleteLogById(' + value + ')" class="btn btn-danger btn-xs"><i class="fa fa-trash"></i> 删除</a>';
					{/if}
					return html;
				}
			},
			{
				field: 'uid',
				title: 'UID',
				formatter: function(value, row, index) {
					return value>0?'<a href="/user?kw='+value+'" target="_blank">'+value+'</a>':'管理员';
				}
			},
			{
				field: 'domain',
				title: '域名'
			},
			{
				field: 'action',
				title: '操作类型'
			},
            {
				field: 'data',
				title: '操作详情'
			},
			{
				field: 'addtime',
				title: '时间'
			}
		],
		onPageChange: function(number, size){
			setStoredPageSize(pageSizeKey, size);
		},
	})
})

function postLogDelete(data, message) {
	layer.confirm(message, {title: '确认删除', icon: 0}, function(index) {
		$.ajax({
			url: '/log/op',
			type: 'post',
			data: data,
			dataType: 'json',
			success: function(res) {
				layer.close(index);
				if (res.code === 0) {
					layer.msg(res.msg || '删除成功', {icon: 1, time: 1000});
					$('#listTable').bootstrapTable('refresh');
					$('#logDeleteIds').val('');
				} else {
					layer.alert(res.msg || '删除失败', {icon: 2});
				}
			},
			error: function() {
				layer.close(index);
				layer.alert('服务器错误，删除失败', {icon: 2});
			}
		});
	});
}

function deleteLogById(id) {
	postLogDelete({act: 'delete', ids: [id]}, '确定要删除日志 #' + id + ' 吗？');
}

function deleteSelectedLogs() {
	var rows = $('#listTable').bootstrapTable('getSelections');
	if (!rows.length) {
		layer.alert('请先选择要删除的日志', {icon: 0});
		return;
	}
	var ids = rows.map(function(row) { return row.id; });
	postLogDelete({act: 'delete', ids: ids}, '确定要删除选中的 ' + ids.length + ' 条日志吗？');
}

function deleteSpecifiedLogs() {
	var value = $('#logDeleteIds').val().trim();
	if (!value || !/^\d+(?:[\s,]+\d+)*$/.test(value)) {
		layer.alert('请输入一个或多个日志ID，多个ID用逗号或空格分隔', {icon: 0});
		return;
	}
	var ids = value.split(/[\s,]+/).filter(function(id) { return id !== ''; });
	postLogDelete({act: 'delete', ids: ids}, '确定要删除指定的 ' + ids.length + ' 条日志吗？');
}

function retainRecentLogs() {
	postLogDelete({act: 'retain7'}, '确定要删除7天以前的全部操作日志，仅保留最近7天吗？此操作不可撤销。');
}
</script>
{/block}
